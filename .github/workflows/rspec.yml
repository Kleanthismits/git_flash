name: RSpec

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    # Keeps the check names `build (3.3)` and `build (3.4)`, which branch protection may require
    name: build (${{ matrix.ruby-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    # The completion specs run the scripts in each shell; the runner has only bash
    - name: Install fish and zsh
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fish zsh

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Check the system map
      if: matrix.ruby-version == '3.3'
      run: |
        sh docs/map/_meta/sync-twins.sh
        git diff --exit-code -- AGENTS.md docs/map
        ruby docs/map/_meta/check.rb

    # Fails below 85% line coverage, or 70% for one file (spec/spec_helper.rb)
    - name: Run RSpec
      run: bundle exec rspec
