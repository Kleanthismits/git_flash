name: RSpec

on: [push, pull_request]

permissions:
  contents: read
  checks: write

jobs:
  build:
    # Keeps the check names `build (3.3)` and `build (3.4)`; the coverage step names one
    name: build (${{ matrix.ruby-version }})
    runs-on: ubuntu-latest

    # Ruby 4.0 and head may fail without failing the run: they warn about what will break next
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']
        experimental: [false]
        include:
          - ruby-version: '4.0'
            experimental: true
          - ruby-version: head
            experimental: true

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    # The completion specs run the scripts in each shell; the runner has only bash
    - name: Install fish and zsh
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fish zsh

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Check the system map
      if: matrix.ruby-version == '3.3'
      run: |
        sh docs/map/_meta/sync-twins.sh
        git diff --exit-code -- AGENTS.md docs/map
        ruby docs/map/_meta/check.rb

    - name: Validate the RBS signatures
      if: matrix.ruby-version == '3.3'
      run: bundle exec rbs -I sig validate

    - name: Run RSpec
      run: bundle exec rspec

    # Using the current repo to perform coverage analysis
    - uses: joshmfrankel/simplecov-check-action@e4d24394253366c3b96d9e73e9b68127b2bad081 # 1.1.0
      if: matrix.ruby-version == '3.3'
      with:
        minimum_suite_coverage: 85
        minimum_file_coverage: 70
        github_token: ${{ secrets.GITHUB_TOKEN }}
        check_job_name: build (3.3)

    # Every call Repo gets in these specs is checked against sig/gitflash/repo.rbs. Runs after
    # the coverage check, which reads the coverage of the full run.
    - name: Check Repo against its signatures
      if: matrix.ruby-version == '3.3'
      env:
        RUBYOPT: -rrbs/test/setup
        RBS_TEST_TARGET: Gitflash::Repo
        RBS_TEST_OPT: -I sig
        RBS_TEST_RAISE: 'true'
        RBS_TEST_LOGLEVEL: error
      run: bundle exec rspec spec/lib/gitflash/repo_spec.rb spec/lib/gitflash/cli_spec.rb
