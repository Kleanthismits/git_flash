name: RSpec

on: [push, pull_request]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Check the system map
      if: matrix.ruby-version == '3.3'
      run: |
        sh docs/map/_meta/sync-twins.sh
        git diff --exit-code -- AGENTS.md docs/map
        ruby docs/map/_meta/check.rb

    - name: Run RSpec
      run: bundle exec rspec

    # Using the current repo to perform coverage analysis
    - uses: joshmfrankel/simplecov-check-action@e4d24394253366c3b96d9e73e9b68127b2bad081 # 1.1.0
      if: matrix.ruby-version == '3.3'
      with:
        minimum_suite_coverage: 85
        minimum_file_coverage: 70
        github_token: ${{ secrets.GITHUB_TOKEN }}
        check_job_name: build (3.3)
