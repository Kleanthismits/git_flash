version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot proposes new SHAs with the version comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Gems: the versions in Gemfile.lock, and the ranges in the Gemfile and gemspec when a new
  # version falls outside them
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
