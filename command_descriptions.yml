branches:
  short: 'List local branches with merge and upstream status'
  long: |
    Lists local branches with their last commit, upstream status (ahead, behind, gone)
    and whether they are merged into the default branch.

    The default branch is the one origin/HEAD points to, else main or master.

    Filters (a branch is listed when it matches any of them):
      --merged      merged into the default branch
      --gone        upstream branch was deleted on the remote
      --stale DAYS  no commits for DAYS days

    Pass --json for machine-readable output.

checkout:
  short: 'Checkout a branch'
  long: |
    Checks out BRANCH when given.

    Without BRANCH, presents a list with all the available local branches:
    use the arrow keys to navigate, type to search, press `enter` to checkout
    and `ctrl+c` to cancel. Without a terminal, BRANCH is required.

delete:
  short: 'Delete branches'
  long: |
    Deletes the given BRANCHES. Without them, presents a list with the local branches
    (without the current, default, main or master branch): press `space` to choose
    branches and `enter` to confirm. Without a terminal, BRANCHES are required.

    Branches with unmerged changes are kept unless --force is given.

    Asks for confirmation before deleting. Pass --yes to skip it, which is required
    without a terminal, or --dry-run to only show what would be deleted.

reset:
  short: 'Reset your code to a commit'
  long: |
    Resets the current branch to COMMIT when given.

    Without COMMIT, presents a list with the latest 100 commits of the current branch:
    use the arrow keys to navigate, type to search, press `enter` to reset to that commit
    and `ctrl+c` to cancel. Without a terminal, COMMIT is required.

    By default performs a mixed reset: your changes are kept as unstaged changes.
    Pass --soft to keep them staged, or --hard to discard them. A hard reset asks for
    confirmation; pass --yes to skip it, which is required without a terminal.

undo:
  short: 'Restore a snapshot (the latest by default)'
  long: |
    Restores the parts of the repository a snapshot saved: deleted or moved branches,
    HEAD, tracked, staged and untracked files, and dropped stash entries. Only parts that
    differ are changed; branches and files created after the snapshot are left alone.

    gitflash saves a snapshot before every change it makes, and the agent hook saves one
    before destructive git commands. List them with `gitflash snapshots`.

    The current state is saved as a new snapshot first, so an undo can itself be undone.
    Asks for confirmation; pass --yes to skip it (required without a terminal) or
    --dry-run to only show the plan.

snapshot:
  short: 'Save the current state so it can be restored with gitflash undo'
  long: |
    Saves branches, HEAD, tracked, staged and untracked files (not ignored ones) and stash
    entries as git objects under refs/gitflash/snapshots/. The working tree is not changed.
    Untracked files larger than 50 MB are skipped and listed.

    Use --scope to save only some parts, for example --scope worktree.

clean:
  short: 'Delete merged, gone, stale or agent-created branches'
  long: |
    Deletes branches that are no longer needed, with a snapshot first so `gitflash undo`
    brings them back.

    Without options it selects branches merged into the default branch and branches whose
    upstream was deleted. Add criteria to select more (a branch is chosen when it matches any):
      --merged       merged into the default branch
      --gone         upstream branch was deleted on the remote
      --stale [DAYS] no commits for DAYS days (default: `stale_days` setting, 30)
      --agent        created by an agent (marked by `gitflash wt add`)

    Never selected: the current and default branch, main, master, `protected` branches from
    .gitflash.yml, and branches checked out in any worktree. Unmerged branches are kept unless
    --force is given. Every chosen branch lists why it was chosen.

    Asks for confirmation; pass --yes to skip it (required without a terminal), or --dry-run.

worktree_remove:
  long: |
    Removes the given worktrees, given as a path or the branch checked out in them. Without
    arguments, shows a menu in a terminal. The main checkout and the current worktree are
    never removed; locked worktrees and worktrees with uncommitted changes are refused
    unless --force is given.

    Each removal saves a snapshot first, including uncommitted and untracked files. Ignored
    files (build output, dependencies, .env) are not saved: the plan and the confirmation list
    them, since removal deletes them for good. A worktree with an untracked file over 50 MB
    is not removed, because the snapshot cannot hold it. `gitflash undo ID` brings the
    directory, its branch and the saved files back.

    Asks for confirmation; pass --yes to skip it (required without a terminal), or --dry-run.
    Accepts the global options after the subcommand: gitflash wt remove feature --yes --json

pick:
  short: 'Cherry-pick commits from another branch'
  long: |
    Moves fixes between branches, for example between agent branches.

    Without SOURCE, a terminal shows a list of the other local branches to choose from (use the
    arrow keys, type to search, `enter` to choose and `ctrl+c` to cancel). Without a terminal,
    SOURCE is required.

    `gitflash pick SOURCE --list` lists the commits of SOURCE that are not on the current branch
    yet, oldest first, with SHA, subject, author, date and a diff summary. A commit whose change
    is already here (the same patch under another SHA) is marked `=` (`applied` in JSON) and is
    never picked. Merge commits are left out.

    `gitflash pick SOURCE SHA...` applies the given commits, oldest first whatever the order
    given, with `git cherry-pick -x` (the message records the origin). Without SHAs, a menu in a
    terminal lets you choose. Add --no-commit to only stage the combined changes.

    A snapshot is saved first and the plan asks for confirmation (pass --yes, required without a
    terminal, or --dry-run). `gitflash undo` returns to the starting point.

    On a conflict the pick stops and the result lists the conflicted files, the commits already
    applied and the ones still waiting. Resolve the files and stage them, then run
    `gitflash pick --continue`. `gitflash pick --skip` drops the commit that conflicts and
    `gitflash pick --abort` returns to the state before the pick (both ask for confirmation and
    save a snapshot first).

    For agents: `gitflash pick SOURCE --list --json` and
    `gitflash pick SOURCE SHA... --yes --json`.

mark:
  short: 'Mark branches as agent or human work'
  long: |
    Records who created a branch, so `gitflash clean --agent` only touches branches an agent
    created. The mark is the git config key `branch.<name>.gitflash-owner` and disappears with
    the branch.

    Without BRANCH the current branch is marked. The owner is `agent` unless --owner human is
    given; --clear removes the mark. A branch without a mark counts as human work.

    `gitflash wt add` marks the branches it creates. Use `gitflash mark` for branches made with
    plain git, for example at the start of an agent session: `gitflash mark`.

    Needs no confirmation. Pass --dry-run to see what would change, --json for the result.
